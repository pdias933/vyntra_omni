name: Integração contínua

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integracao-continua-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DO_NOT_TRACK: '1'
  EXPO_NO_TELEMETRY: '1'
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  PNPM_SHA256: 0a9b76dedb5fe8cc5e7f3a9fd70854181cfb08a487ebaf0c9cfb044dc860936c
  PNPM_VERSION: 11.24.0
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  ambiente_local:
    name: Ambiente Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: vyntra-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obter código sem persistir credencial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Gerar segredos locais sintéticos
        run: node scripts/ambiente-local.mjs preparar

      - name: Validar configuração do Compose
        run: node scripts/ambiente-local.mjs validar

      - name: Subir, testar persistência e remover ambiente efêmero
        run: |
          set -euo pipefail
          limpar_ambiente() {
            docker compose down --volumes --remove-orphans
          }
          trap limpar_ambiente EXIT

          node scripts/ambiente-local.mjs subir

          codigo_http="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/saude/pronto)"
          test "${codigo_http}" = '200'

          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "INSERT INTO registro_auditoria (id, tipo_evento, origem, acao, correlacao_id) VALUES ('\''80000000-0000-4000-8000-000000000001'\'', '\''VERIFICACAO_CI'\'', '\''SISTEMA'\'', '\''VERIFICAR_IMUTABILIDADE'\'', '\''80000000-0000-4000-8000-000000000002'\'');"' </dev/null

          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "UPDATE registro_auditoria SET acao = '\''ALTERACAO_PROIBIDA'\'';"' </dev/null >/dev/null 2>&1
          then
            echo '::error::UPDATE de auditoria não foi bloqueado.'
            exit 1
          fi
          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "DELETE FROM registro_auditoria;"' </dev/null >/dev/null 2>&1
          then
            echo '::error::DELETE de auditoria não foi bloqueado.'
            exit 1
          fi
          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "TRUNCATE registro_auditoria;"' </dev/null >/dev/null 2>&1
          then
            echo '::error::TRUNCATE de auditoria não foi bloqueado.'
            exit 1
          fi
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT count(*) FROM registro_auditoria WHERE tipo_evento = '\''VERIFICACAO_CI'\'';"' </dev/null \
            | grep --quiet --line-regexp 1

          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "BEGIN; INSERT INTO evento_dominio (id, tipo, entidade_tipo, entidade_id, classificacao_dados, dados_protegidos_minimizados) VALUES ('\''90000000-0000-4000-8000-000000000001'\'', '\''VERIFICACAO_CI_CRIADA'\'', '\''REGISTRO_VERIFICACAO'\'', '\''90000000-0000-4000-8000-000000000002'\'', '\''OPERACIONAL'\'', '\''{}'\''::jsonb); INSERT INTO item_caixa_saida (id, evento_dominio_id, tipo, destino, dados_protegidos_minimizados) VALUES ('\''90000000-0000-4000-8000-000000000003'\'', '\''90000000-0000-4000-8000-000000000001'\'', '\''DISTRIBUIR_EVENTO'\'', '\''DISTRIBUIDOR_EVENTOS'\'', '\''{}'\''::jsonb); COMMIT;"' </dev/null
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT count(*) FROM evento_dominio e JOIN item_caixa_saida c ON c.evento_dominio_id = e.id WHERE e.id = '\''90000000-0000-4000-8000-000000000001'\'';"' </dev/null \
            | grep --quiet --line-regexp 1

          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "BEGIN; INSERT INTO evento_dominio (id, tipo, entidade_tipo, entidade_id, classificacao_dados, dados_protegidos_minimizados) VALUES ('\''90000000-0000-4000-8000-000000000004'\'', '\''VERIFICACAO_ROLLBACK'\'', '\''REGISTRO_VERIFICACAO'\'', '\''90000000-0000-4000-8000-000000000005'\'', '\''OPERACIONAL'\'', '\''{}'\''::jsonb); INSERT INTO item_caixa_saida (id, evento_dominio_id, tipo, destino, dados_protegidos_minimizados) VALUES ('\''90000000-0000-4000-8000-000000000006'\'', '\''90000000-0000-4000-8000-000000000004'\'', '\''DISTRIBUIR_EVENTO'\'', '\''destino-invalido'\'', '\''{}'\''::jsonb); COMMIT;"' </dev/null >/dev/null 2>&1
          then
            echo '::error::Transação inválida de evento/caixa de saída não foi revertida.'
            exit 1
          fi
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT count(*) FROM evento_dominio WHERE id = '\''90000000-0000-4000-8000-000000000004'\'';"' </dev/null \
            | grep --quiet --line-regexp 0

          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "BEGIN; INSERT INTO registro_idempotencia (id, escopo_tipo, escopo_id, chave_hash, assinatura_requisicao_hash) VALUES ('\''a0000000-0000-4000-8000-000000000001'\'', '\''USUARIO'\'', '\''a0000000-0000-4000-8000-000000000002'\'', repeat('\''a'\'', 64), repeat('\''b'\'', 64)); INSERT INTO operacao_recuperavel (id, registro_idempotencia_id, tipo, atualizado_em) VALUES ('\''a0000000-0000-4000-8000-000000000003'\'', '\''a0000000-0000-4000-8000-000000000001'\'', '\''VERIFICAR_IDEMPOTENCIA'\'', CURRENT_TIMESTAMP); COMMIT;"' </dev/null
          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "INSERT INTO registro_idempotencia (id, escopo_tipo, escopo_id, chave_hash, assinatura_requisicao_hash) VALUES ('\''a0000000-0000-4000-8000-000000000004'\'', '\''USUARIO'\'', '\''a0000000-0000-4000-8000-000000000002'\'', repeat('\''a'\'', 64), repeat('\''b'\'', 64));"' </dev/null >/dev/null 2>&1
          then
            echo '::error::Chave idempotente duplicada foi aceita no mesmo escopo.'
            exit 1
          fi
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT count(*) FROM registro_idempotencia r JOIN operacao_recuperavel o ON o.registro_idempotencia_id = r.id WHERE r.id = '\''a0000000-0000-4000-8000-000000000001'\'';"' </dev/null \
            | grep --quiet --line-regexp 1
          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "UPDATE operacao_recuperavel SET estado = '\''EM_EXECUCAO'\'', proxima_acao_em = NULL WHERE id = '\''a0000000-0000-4000-8000-000000000003'\'';"' </dev/null >/dev/null 2>&1
          then
            echo '::error::Estado ativo sem concessão foi aceito.'
            exit 1
          fi
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT count(*) FROM operacao_recuperavel WHERE id = '\''a0000000-0000-4000-8000-000000000003'\'' AND estado = '\''PENDENTE'\'';"' </dev/null \
            | grep --quiet --line-regexp 1

          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "BEGIN; INSERT INTO perfil_acesso (id, nome, nome_normalizado, papel_base) VALUES ('\''b0000000-0000-4000-8000-000000000001'\'', '\''Administrador sem concessão'\'', '\''administrador-sem-concessao'\'', '\''ADMINISTRADOR'\''), ('\''b0000000-0000-4000-8000-000000000002'\'', '\''Supervisor de aceite'\'', '\''supervisor-de-aceite'\'', '\''SUPERVISOR'\''); INSERT INTO usuario (id, nome_exibicao, perfil_id) VALUES ('\''b0000000-0000-4000-8000-000000000003'\'', '\''Usuário sem perfil'\'', NULL), ('\''b0000000-0000-4000-8000-000000000004'\'', '\''Supervisor sintético'\'', '\''b0000000-0000-4000-8000-000000000002'\''); INSERT INTO permissao_perfil (perfil_id, codigo, efeito) VALUES ('\''b0000000-0000-4000-8000-000000000002'\'', '\''VISUALIZAR_FILA'\'', '\''CONCEDER'\''); INSERT INTO fila (id, nome, nome_normalizado) VALUES ('\''b0000000-0000-4000-8000-000000000005'\'', '\''Fila sintética'\'', '\''fila-sintetica'\''); INSERT INTO acesso_usuario_fila (usuario_id, fila_id) VALUES ('\''b0000000-0000-4000-8000-000000000004'\'', '\''b0000000-0000-4000-8000-000000000005'\''); COMMIT;"' </dev/null
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT ((SELECT count(*) FROM usuario WHERE id = '\''b0000000-0000-4000-8000-000000000003'\'' AND perfil_id IS NULL) = 1 AND (SELECT count(*) FROM permissao_perfil WHERE perfil_id = '\''b0000000-0000-4000-8000-000000000001'\'') = 0 AND (SELECT count(*) FROM acesso_usuario_fila WHERE usuario_id = '\''b0000000-0000-4000-8000-000000000003'\'') = 0)::int;"' </dev/null \
            | grep --quiet --line-regexp 1
          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "INSERT INTO perfil_acesso (id, nome, nome_normalizado, papel_base) VALUES ('\''b0000000-0000-4000-8000-000000000006'\'', '\''Nome duplicado'\'', '\''supervisor-de-aceite'\'', '\''ATENDENTE'\'');"' </dev/null >/dev/null 2>&1
          then
            echo '::error::Nome normalizado duplicado de perfil foi aceito.'
            exit 1
          fi
          if docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "UPDATE acesso_usuario_fila SET estado = '\''REVOGADO'\'' WHERE usuario_id = '\''b0000000-0000-4000-8000-000000000004'\'' AND fila_id = '\''b0000000-0000-4000-8000-000000000005'\'';"' </dev/null >/dev/null 2>&1
          then
            echo '::error::Acesso revogado sem timestamp foi aceito.'
            exit 1
          fi
          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT ((SELECT count(*) FROM permissao_perfil WHERE perfil_id = '\''b0000000-0000-4000-8000-000000000002'\'' AND codigo = '\''VISUALIZAR_FILA'\'' AND efeito = '\''CONCEDER'\'') = 1 AND (SELECT count(*) FROM acesso_usuario_fila WHERE usuario_id = '\''b0000000-0000-4000-8000-000000000004'\'' AND fila_id = '\''b0000000-0000-4000-8000-000000000005'\'' AND estado = '\''ATIVO'\'') = 1)::int;"' </dev/null \
            | grep --quiet --line-regexp 1

          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --set ON_ERROR_STOP=1 --command "CREATE TABLE verificacao_pr004 (valor text PRIMARY KEY); INSERT INTO verificacao_pr004 VALUES ('\''persistiu'\'');"' </dev/null
          docker compose exec -T minio /usr/bin/sh -ceu \
            'export MC_HOST_local="http://$(cat /run/secrets/usuario_minio):$(cat /run/secrets/senha_minio)@127.0.0.1:9000"
            timeout 15 mc ls local >/dev/null
            mc mb --ignore-existing local/verificacao-pr004 >/dev/null
            printf "persistiu\n" | mc pipe local/verificacao-pr004/marcador >/dev/null' </dev/null
          docker compose exec -T redis sh -ec \
            'REDISCLI_AUTH="$(sed -n "s/^user vyntra on >\([^ ]*\).*/\1/p" /run/secrets/redis.acl)" redis-cli --user vyntra set verificacao:pr004 persistiu >/dev/null' </dev/null

          docker compose restart postgres redis minio
          docker compose up --wait --no-build

          docker compose exec -T postgres sh -ceu \
            'PGPASSWORD="$(cat /run/secrets/senha_postgresql)" exec psql --host 127.0.0.1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-password --tuples-only --no-align --command "SELECT valor FROM verificacao_pr004;"' </dev/null \
            | grep --quiet --line-regexp persistiu
          docker compose exec -T minio /usr/bin/sh -ceu \
            'export MC_HOST_local="http://$(cat /run/secrets/usuario_minio):$(cat /run/secrets/senha_minio)@127.0.0.1:9000"
            mc cat local/verificacao-pr004/marcador' </dev/null \
            | grep --quiet --line-regexp persistiu
          docker compose exec -T redis sh -ec \
            'REDISCLI_AUTH="$(sed -n "s/^user vyntra on >\([^ ]*\).*/\1/p" /run/secrets/redis.acl)" redis-cli --user vyntra get verificacao:pr004' </dev/null \
            | grep --quiet --line-regexp persistiu

  qualidade:
    name: Qualidade e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Obter código sem persistir credencial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Preparar pnpm com integridade verificada
        run: |
          set -euo pipefail
          arquivo="$(mktemp)"
          diretorio="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${arquivo}" \
            "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-x64.tar.gz"
          printf '%s  %s\n' "${PNPM_SHA256}" "${arquivo}" | sha256sum --check --strict
          tar -xzf "${arquivo}" -C "${diretorio}"
          test "$("${diretorio}/pnpm" --version)" = "${PNPM_VERSION}"
          printf '%s\n' "${diretorio}" >> "${GITHUB_PATH}"

      - name: Instalar pelo lockfile
        run: pnpm install --frozen-lockfile

      - name: Verificar matriz do Expo
        run: pnpm verificar:expo

      - name: Verificar lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Compilar aplicações
        run: pnpm build

  dependencias:
    name: Dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código sem persistir credencial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Preparar pnpm com integridade verificada
        run: |
          set -euo pipefail
          arquivo="$(mktemp)"
          diretorio="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${arquivo}" \
            "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/pnpm-linux-x64.tar.gz"
          printf '%s  %s\n' "${PNPM_SHA256}" "${arquivo}" | sha256sum --check --strict
          tar -xzf "${arquivo}" -C "${diretorio}"
          test "$("${diretorio}/pnpm" --version)" = "${PNPM_VERSION}"
          printf '%s\n' "${diretorio}" >> "${GITHUB_PATH}"

      - name: Instalar parser sem executar scripts de dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Auditar árvore completa
        env:
          PNPM_EXECUTAVEL: pnpm
        run: node scripts/verificar-dependencias.mjs

  segredos:
    name: Segredos no histórico
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obter histórico sem persistir credencial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar Gitleaks com integridade verificada
        env:
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          GITLEAKS_VERSION: 8.30.0
        run: |
          set -euo pipefail
          arquivo="$(mktemp)"
          diretorio="$(mktemp -d)"
          fixture="$(mktemp)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${arquivo}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${arquivo}" | sha256sum --check --strict
          tar -xzf "${arquivo}" -C "${diretorio}" gitleaks
          test "$("${diretorio}/gitleaks" version)" = "${GITLEAKS_VERSION}"
          parte_um='Y7qP9mK2vR8sT4wX6z'
          parte_dois='A3bC5dE1fG0hJ4nL8M'
          printf 'token = "ghp_%s%s"\n' "${parte_um}" "${parte_dois}" > "${fixture}"
          if "${diretorio}/gitleaks" dir "${fixture}" \
            --config "${GITHUB_WORKSPACE}/.github/gitleaks.toml" \
            --gitleaks-ignore-path "${GITHUB_WORKSPACE}/.github/gitleaksignore" \
            --ignore-gitleaks-allow --redact --no-banner >/dev/null 2>&1
          then
            estado_canario=0
          else
            estado_canario=$?
          fi
          if [[ "${estado_canario}" -ne 1 ]]
          then
            echo '::error::O scanner não rejeitou corretamente o canário sintético.'
            exit 1
          fi
          "${diretorio}/gitleaks" git "${GITHUB_WORKSPACE}" \
            --config "${GITHUB_WORKSPACE}/.github/gitleaks.toml" \
            --gitleaks-ignore-path "${GITHUB_WORKSPACE}/.github/gitleaksignore" \
            --ignore-gitleaks-allow --redact --no-banner
