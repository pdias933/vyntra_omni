packages:
  - apps/*
  - packages/*

engineStrict: true
nodeLinker: hoisted
pmOnFail: error
saveExact: true
sharedWorkspaceLockfile: true
strictDepBuilds: true
verifyDepsBeforeRun: error

overrides:
  deepmerge-ts: 8.0.2
  js-yaml: 4.3.2
  mysql2: 3.24.2
  react: 19.2.3
  react-dom: 19.2.3

allowBuilds:
  '@scarf/scarf': false
  '@prisma/engines': true
  prisma: true

minimumReleaseAgeExclude:
  - '@xyflow/react@12.11.6'
  - '@xyflow/system@0.0.82'
